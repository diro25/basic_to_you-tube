<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; background: #f1f0ff; display: flex; justify-content: center; padding: 50px; }
        .container { width: 500px; }
        h1 { color: #553c9a; text-align: center; }
        
        .stats { display: flex; gap: 10px; margin: 20px 0; }
        .stat-card { background: white; padding: 15px; border-radius: 8px; flex: 1; text-align: center; border: 1px solid #ddd; }
        .stat-card span { display: block; font-size: 20px; font-weight: bold; color: #553c9a; }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .add-btn { background: #6b46c1; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
        
        .task-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; align-items: center; border: 1px solid #ddd; transition: 0.2s; }
        .task-item.completed { opacity: 0.6; text-decoration: line-through; }
        .actions { margin-left: auto; display: none; gap: 10px; }
        .task-item:hover .actions { display: flex; }
        .edit-btn { color: blue; cursor: pointer; }
        .delete-btn { color: red; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>To-Do List</h1>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button class="add-btn" onclick="addTask()">+ Add</button>
    </div>
    
    <div class="stats">
        <div class="stat-card">Active <span id="activeCount">0</span></div>
        <div class="stat-card">Completed <span id="completedCount">0</span></div>
        <div class="stat-card">Total <span id="totalCount">0</span></div>
    </div>

    <div id="taskList"></div>
</div>

<script>
    // Initial data
    const defaultTasks = ["Welcome to your to-do list!", "Click the checkbox to mark as complete", "Hover to delete items"];

    function createNewTaskElement(text) {
        let div = document.createElement("div");
        div.className = "task-item";
        div.innerHTML = `
            <input type="checkbox" onchange="toggleTask(this)">
            <span class="text-span" style="flex:1; margin-left: 10px;">${text}</span>
            <div class="actions">
                <span class="edit-btn" onclick="editTask(this)">✎</span>
                <span class="delete-btn" onclick="removeTask(this)">🗑</span>
            </div>
        `;
        return div;
    }

    // Load defaults on start
    defaultTasks.forEach(task => {
        document.getElementById("taskList").appendChild(createNewTaskElement(task));
    });
    updateStats();

    function addTask() {
        let input = document.getElementById("taskInput");
        if (!input.value) return;
        document.getElementById("taskList").appendChild(createNewTaskElement(input.value));
        input.value = "";
        updateStats();
    }

    function toggleTask(checkbox) {
        checkbox.parentElement.classList.toggle("completed");
        updateStats();
    }

    function editTask(btn) {
        let textSpan = btn.parentElement.parentElement.querySelector(".text-span");
        let newText = prompt("Edit task:", textSpan.innerText);
        if (newText) textSpan.innerText = newText;
    }

    function removeTask(btn) {
        btn.parentElement.parentElement.remove();
        updateStats();
    }

    function updateStats() {
        let tasks = document.getElementsByClassName("task-item");
        let completed = document.getElementsByClassName("completed");
        document.getElementById("totalCount").innerText = tasks.length;
        document.getElementById("completedCount").innerText = completed.length;
        document.getElementById("activeCount").innerText = tasks.length - completed.length;
    }
</script>

</body>
</html>
